# Render Blueprint
# Dashboard → New → Blueprint → このリポジトリを選択してデプロイ
databases:
  - name: tasks-db
    databaseName: tasks_app
    user: tasks_app
    plan: free

services:
  - type: web
    name: tasks-app-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push --skip-generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tasks-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Vercel デプロイ後に本番 URL を設定（例: https://your-app.vercel.app）
      - key: CORS_ORIGIN
        sync: false
