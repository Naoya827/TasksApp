# Render Blueprint（Singapore リージョン）
# Dashboard → New → Blueprint → このリポジトリを選択してデプロイ
# ※ API と DB は必ず同じリージョンにすること
databases:
  - name: tasks-db
    databaseName: tasks_app
    user: tasks_app
    plan: free
    region: singapore

services:
  - type: web
    name: tasks-app-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tasks-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Vercel デプロイ後に本番 URL を設定（例: https://your-app.vercel.app）
      - key: CORS_ORIGIN
        sync: false
